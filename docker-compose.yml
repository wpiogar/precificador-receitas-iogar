# ============================================================================
# DOCKER COMPOSE - FOOD COST SYSTEM
# ============================================================================
# Descrição: Orquestração completa do sistema (Backend + Frontend + DB)
# Serviços: PostgreSQL, Backend FastAPI, Frontend React/Vite, Redis (cache)
# Compatível com: Docker Compose v3.8+
# Data: 25/11/2025
# Autor: Will - Empresa: IOGAR
# ============================================================================

# ============================================================================
# DEFINIÇÃO DOS SERVIÇOS
# ============================================================================

services:
  # ==========================================================================
  # BANCO DE DADOS POSTGRESQL
  # ==========================================================================
  db:
    image: postgres:15-alpine
    container_name: foodcost-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-food_cost_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Volume persistente para dados do PostgreSQL
      - postgres_data:/var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - foodcost-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-food_cost_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # REDIS PARA CACHE E SESSÕES
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: foodcost-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - foodcost-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ==========================================================================
  # BACKEND - FASTAPI COM SISTEMA DE IA
  # ==========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodcost-backend
    restart: unless-stopped
    environment:
      # Configurações do banco de dados
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres123@db:5432/food_cost_db}
      
      # Configurações do Redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      
      # Configurações da aplicação
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      
      # Configurações da API
      API_V1_STR: ${API_V1_STR:-/api/v1}
      PROJECT_NAME: ${PROJECT_NAME:-Food Cost System}
      
      # Configurações CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    volumes:
      # Volume para dados persistentes do sistema de IA
      - ai_data:/app/app/ai/data
      - ai_logs:/app/app/ai/logs
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - foodcost-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================================================
  # FRONTEND - REACT/VITE COM NGINX
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_ENVIRONMENT: ${VITE_ENVIRONMENT:-development}
    container_name: foodcost-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - foodcost-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

# ============================================================================
# DEFINIÇÃO DOS VOLUMES PERSISTENTES
# ============================================================================

volumes:
  # Volume para dados do PostgreSQL
  postgres_data:
    driver: local
    name: foodcost_postgres_data

  # Volume para dados do Redis
  redis_data:
    driver: local
    name: foodcost_redis_data

  # Volume para dados do sistema de IA
  ai_data:
    driver: local
    name: foodcost_ai_data

  # Volume para logs do sistema de IA
  ai_logs:
    driver: local
    name: foodcost_ai_logs

# ============================================================================
# DEFINIÇÃO DA REDE
# ============================================================================

networks:
  foodcost-network:
    driver: bridge
    name: foodcost_network
# ============================================================================
# NGINX CONFIGURATION - FOOD COST SYSTEM FRONTEND
# ============================================================================
# Descrição: Configuração Nginx para servir React/Vite SPA
# Features: SPA routing, cache, proxy reverso, segurança, compressão
# Data: 25/11/2025
# Autor: Will - Empresa: IOGAR
# ============================================================================

# ============================================================================
# CONFIGURAÇÃO DE COMPRESSÃO GZIP
# ============================================================================
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml text/javascript 
           application/x-javascript application/xml+rss 
           application/javascript application/json
           application/vnd.ms-fontobject application/x-font-ttf 
           font/opentype image/svg+xml image/x-icon;

# ============================================================================
# CONFIGURAÇÃO DO SERVIDOR
# ============================================================================
server {
    listen 80;
    server_name localhost;
    
    # Diretório raiz com arquivos do build
    root /usr/share/nginx/html;
    index index.html;

    # Tamanho máximo de upload
    client_max_body_size 10M;

    # ========================================================================
    # CONFIGURAÇÃO PARA SPA (Single Page Application)
    # ========================================================================
    # React Router: todas as rotas devem retornar index.html
    location / {
        try_files $uri $uri/ /index.html;
        
        # Headers de segurança
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # CSP (Content Security Policy) - ajustar conforme necessário
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http://localhost:8000 http://backend:8000;" always;
    }

    # ========================================================================
    # CACHE PARA ARQUIVOS ESTÁTICOS
    # ========================================================================
    # Assets com hash no nome (podem ter cache longo)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html não deve ter cache (sempre buscar versão mais recente)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # ========================================================================
    # PROXY REVERSO PARA BACKEND API
    # ========================================================================
    location /api/ {
        # Proxy pass para container do backend
        proxy_pass http://backend:8000;
        
        # Headers HTTP/1.1
        proxy_http_version 1.1;
        
        # Headers de proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # WebSocket support (para futuras features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ========================================================================
    # HEALTH CHECK ENDPOINT
    # ========================================================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ========================================================================
    # LOGS
    # ========================================================================
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # ========================================================================
    # PÁGINAS DE ERRO CUSTOMIZADAS
    # ========================================================================
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# ============================================================================
# NOTAS
# ============================================================================
# 1. O hostname "backend" deve corresponder ao service name no docker-compose.yml
# 2. CSP pode precisar ajustes dependendo de bibliotecas JavaScript usadas
# 3. Para HTTPS, adicionar configuração SSL e redirecionar HTTP -> HTTPS
# 4. Em produção, ajustar server_name para domínio real
# ============================================================================